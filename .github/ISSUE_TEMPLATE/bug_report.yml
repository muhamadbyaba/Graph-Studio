name: Bug report
description: Something behaves differently from how it is documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file this.

        **If this is a security issue, please do not use this form.** Use the
        Security tab to open a private advisory instead — see `SECURITY.md`.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, and what the software did instead of what you expected.
      placeholder: |
        I drew a 12 m cold run to a shower and the size came back as Ø20.
        I expected Ø25 at that demand.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: How to reproduce
      description: |
        Exact steps. If the issue involves a drawing, the fastest way to hand it over is
        the **Export** button in the toolbar — paste the JSON here or attach the file.
        It replays the design exactly.
      placeholder: |
        1. Sign in and start from a fresh workspace
        2. Place a tank at (2, 6) and a shower at (14, 6)
        3. Connect them with the Pipe tool
        4. Select the pipe — the inspector shows …
    validations:
      required: true

  - type: input
    id: jurisdiction
    attributes:
      label: Jurisdiction
      description: Which code pack was active. Engineering results depend on it.
      placeholder: GULF
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: What you expected, and why
      description: |
        For an engineering result, this is the most useful field. Give the reference you
        are comparing against — a code clause, a hand calculation, or a published table.
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Output of `git rev-parse --short HEAD`, or the release tag.
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: How are you running it
      options:
        - Local (npm start)
        - Local, unauthenticated mode (BG_AUTH_MODE=open)
        - Self-hosted behind a reverse proxy
        - Container
        - Other
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node version
      description: Output of `node --version`.
      placeholder: v24.11.1
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Console or server output
      description: Anything the browser console or the server printed. This is automatically formatted as code.
      render: shell
    validations:
      required: false
